<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages — Ajay Singh Rathore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-layout">

    <!-- ===== SIDEBAR ===== -->
    <aside class="admin-sidebar" id="sidebar">
        <div class="sidebar-brand">
            <span class="sidebar-brand-name">ASR</span>
            <span class="sidebar-brand-sub">Studio Admin</span>
        </div>
        <nav class="sidebar-nav">
            <div class="sidebar-section-label">Navigation</div>
            <a href="dashboard.html" class="sidebar-link">
                <i class="fas fa-chart-line"></i> Dashboard
            </a>
            <a href="projects.html" class="sidebar-link">
                <i class="fas fa-layer-group"></i> Projects
            </a>
            <a href="messages.html" class="sidebar-link active">
                <i class="fas fa-envelope"></i> Messages
            </a>
        </nav>
        <div class="sidebar-footer">
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> <span>Sign Out</span>
            </button>
        </div>
    </aside>

    <!-- ===== MAIN ===== -->
    <main class="admin-main">

        <header class="admin-topbar">
            <button class="d-md-none" onclick="document.getElementById('sidebar').classList.toggle('open')" style="background:none;border:none;color:var(--text-muted);font-size:1.1rem;padding:0;margin-right:.5rem;">
                <i class="fas fa-bars"></i>
            </button>
            <div class="topbar-title">Messages</div>
            <div class="topbar-breadcrumb">
                <a href="dashboard.html"><span>Dashboard</span></a>
                <span class="sep">/</span>
                <span style="color:var(--text);">Contact Messages</span>
            </div>
        </header>

        <div class="admin-content">

            <!-- Page header -->
            <div style="margin-bottom:2.5rem;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1rem;">
                <div>
                    <p style="font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:.4rem;">Inbox</p>
                    <h2 style="font-size:2.2rem;font-weight:300;color:var(--text);">Contact <em style="font-style:italic;">Messages</em></h2>
                </div>
                <!-- Filter -->
                <div style="display:flex;gap:.75rem;flex-wrap:wrap;align-items:center;">
                    <div style="position:relative;">
                        <i class="fas fa-search" style="position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--text-subtle);font-size:.75rem;"></i>
                        <input id="msgSearch" type="text" placeholder="Search messages…"
                            style="background:rgba(255,255,255,.03);border:1px solid var(--border-mid);color:var(--text);border-radius:100px;padding:.5rem .9rem .5rem 2.2rem;font-family:'DM Sans',sans-serif;font-size:.78rem;width:200px;transition:border-color .2s;"
                            oninput="filterMessages(this.value)"
                            onfocus="this.style.borderColor='var(--border-accent)'"
                            onblur="this.style.borderColor='var(--border-mid)'">
                    </div>
                </div>
            </div>

            <!-- Messages Table -->
            <div class="panel-card">
                <div class="panel-card-header">
                    <span class="panel-card-title">All Messages</span>
                    <span id="msgCount" style="font-size:.7rem;color:var(--text-subtle);">Loading…</span>
                </div>
                <div style="overflow-x:auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Project Type</th>
                                <th>Message</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="messagesTable">
                            <tr>
                                <td colspan="6">
                                    <div class="empty-state">
                                        <i class="fas fa-envelope-open"></i>
                                        <p>Loading messages…</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>
</div>

<!-- Message Detail Modal -->
<div class="modal fade" id="messageModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered" style="max-width:520px;">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="msgModalName">Message Detail</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div style="display:grid;gap:.6rem;margin-bottom:1.25rem;">
                    <div style="display:flex;gap:8px;">
                        <span style="font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle);min-width:90px;padding-top:.15rem;">Email</span>
                        <span id="msgModalEmail" style="font-size:.88rem;color:var(--text);"></span>
                    </div>
                    <div style="display:flex;gap:8px;">
                        <span style="font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle);min-width:90px;padding-top:.15rem;">Project Type</span>
                        <span id="msgModalType" style="font-size:.88rem;color:var(--text);"></span>
                    </div>
                    <div style="display:flex;gap:8px;">
                        <span style="font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle);min-width:90px;padding-top:.15rem;">Date</span>
                        <span id="msgModalDate" style="font-size:.88rem;color:var(--text);"></span>
                    </div>
                </div>
                <div style="background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;padding:1.25rem;">
                    <p style="font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle);margin-bottom:.75rem;">Message</p>
                    <p id="msgModalBody" style="font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-style:italic;color:var(--text);line-height:1.6;"></p>
                </div>
            </div>
            <div class="modal-footer">
                <a id="msgReplyLink" href="#" class="btn-accent" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;">
                    <i class="fas fa-reply"></i> <span>Reply via Email</span>
                </a>
                <button type="button" class="btn-ghost" data-bs-dismiss="modal"><span>Close</span></button>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="admin-toast" id="adminToast">
    <i class="toast-icon fas fa-check-circle"></i>
    <span class="toast-msg" id="toastMsg"></span>
</div>

<script>
// Client-side filter
function filterMessages(q) {
    q = q.toLowerCase();
    const rows = document.querySelectorAll('#messagesTable tr[data-id]');
    let visible = 0;
    rows.forEach(r => {
        const show = r.textContent.toLowerCase().includes(q);
        r.style.display = show ? '' : 'none';
        if (show) visible++;
    });
    document.getElementById('msgCount').textContent = visible + ' message' + (visible !== 1 ? 's' : '');
}

// Open message detail modal (called from messages.js row click or view button)
function viewMessage(id, name, email, type, message, date) {
    document.getElementById('msgModalName').textContent = name;
    document.getElementById('msgModalEmail').textContent = email;
    document.getElementById('msgModalType').textContent = type || '—';
    document.getElementById('msgModalDate').textContent = date || '—';
    document.getElementById('msgModalBody').textContent = message;
    document.getElementById('msgReplyLink').href = 'mailto:' + email + '?subject=Re: Your Enquiry — Ajay Singh Rathore Studio';
    const modal = new bootstrap.Modal(document.getElementById('messageModal'));
    modal.show();
}

function showToast(msg, type='success') {
    const t = document.getElementById('adminToast');
    t.querySelector('.toast-msg').textContent = msg;
    t.className = 'admin-toast show ' + type;
    t.querySelector('.toast-icon').className = 'toast-icon fas ' + (type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle');
    setTimeout(() => t.classList.remove('show'), 3500);
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Route unchanged -->
<script src="js/messages.js"></script>
</body>
</html>
