<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Ajay Singh Rathore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="login-page">
    <div class="login-card" style="animation: fadeUp .6s cubic-bezier(.16,1,.3,1) both;">

        <!-- Brand -->
        <span class="login-logo">Ajay Singh Rathore</span>
        <span class="login-subtitle">Studio Admin</span>

        <h2 class="login-heading">Sign <em style="font-style:italic; color:var(--accent);">In</em></h2>

        <!-- Error alert -->
        <div class="login-error" id="loginError">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span id="loginErrorMsg">Invalid credentials. Please try again.</span>
        </div>

        <form id="loginForm" autocomplete="off">
            <div class="mb-2">
                <label class="form-label">Username</label>
                <div class="input-group-admin">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" class="form-control" placeholder="Enter username" required autocomplete="username">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group-admin" style="position:relative;">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password" style="padding-right:3rem !important;">
                    <button type="button" id="togglePass" style="position:absolute;right:.9rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-subtle);cursor:pointer;z-index:3;font-size:.85rem;" aria-label="Toggle password visibility">
                        <i class="fas fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span>Access Dashboard</span>
                <i class="fas fa-arrow-right fa-xs"></i>
            </button>
        </form>

        <p style="font-size:.68rem;letter-spacing:.1em;text-align:center;color:var(--text-subtle);margin-top:2rem;">
            AJAY SINGH RATHORE &nbsp;·&nbsp; ARCHITECT &nbsp;·&nbsp; JAIPUR
        </p>
    </div>
</div>

<style>
@keyframes fadeUp {
    from { opacity:0; transform: translateY(24px); }
    to   { opacity:1; transform: translateY(0); }
}
</style>

<script>
// Toggle password visibility
document.getElementById('togglePass').addEventListener('click', function() {
    const inp = document.getElementById('password');
    const icon = document.getElementById('toggleIcon');
    if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'fas fa-eye-slash';
    } else {
        inp.type = 'password';
        icon.className = 'fas fa-eye';
    }
});

// Show error
function showError(msg) {
    const el = document.getElementById('loginError');
    document.getElementById('loginErrorMsg').textContent = msg || 'Invalid credentials.';
    el.classList.add('show');
}

// Shake animation on error
function shakeCard() {
    const card = document.querySelector('.login-card');
    card.style.animation = 'shake .4s ease';
    setTimeout(() => card.style.animation = '', 400);
}
</script>
<style>
@keyframes shake {
    0%,100% { transform: translateX(0); }
    20%      { transform: translateX(-8px); }
    40%      { transform: translateX(8px); }
    60%      { transform: translateX(-5px); }
    80%      { transform: translateX(5px); }
}
</style>

<!-- Route unchanged -->
<script src="js/login.js"></script>
</body>
</html>
